<div class="lock-screen-container">
  <!-- Glowing Ambient Background Effects -->
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>
  <div class="grid-overlay"></div>

  <div class="lock-card" [class.shake]="isShaking()">
    <!-- Header / Brand -->
    <div class="brand-section">
      <div class="icon-wrapper">
        <svg class="lock-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
      </div>
      <h1 class="title">KORA VISUALIZER</h1>
      <p class="subtitle">Enter application password to proceed</p>
    </div>

    <!-- Form -->
    <form (submit)="$event.preventDefault(); onSubmit()" class="lock-form">
      <div class="input-group" [class.error]="errorMessage()">
        <label for="password-input" class="input-label">Access Password</label>
        
        <div class="input-wrapper">
          <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>

          <input
            #passwordInput
            id="password-input"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••••••••••"
            [disabled]="isLoading() || isLockedOut()"
            autocomplete="current-password"
            autofocus
            class="password-field"
          />

          <button
            type="button"
            class="toggle-eye-btn"
            (click)="toggleShowPassword()"
            [disabled]="isLockedOut()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>

        <!-- Error Message & Cooldown -->
        <div *ngIf="errorMessage()" class="error-banner">
          <svg class="error-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span>
            {{ errorMessage() }}
            <strong *ngIf="isLockedOut()"> ({{ cooldownSeconds() }}s)</strong>
          </span>
        </div>
      </div>

      <!-- Action Button -->
      <button
        type="submit"
        class="unlock-btn"
        [disabled]="isLoading() || isLockedOut() || !password.trim()"
      >
        <span *ngIf="!isLoading()">Unlock Application</span>
        <div *ngIf="isLoading()" class="spinner"></div>
      </button>
    </form>

    <!-- Footer Note -->
    <div class="lock-footer">
      <span class="shield-badge">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
        Protected by Environment Variables & SHA-256 Web Crypto
      </span>
    </div>
  </div>
</div>
